# 持续自检：每次 push / PR 自动跑静态分析与全部测试。
# 这是设计方案原则 2（时机即体验）与测试套件的机制化守门。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 测试
        run: flutter test

  # 每次推送产出 release APK：手机无需任何开发环境，
  # 在 Actions 页面下载 artifact 直接安装（私有仓库需登录有权限的账号）。
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: busy_blind-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
